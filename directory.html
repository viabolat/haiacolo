<body class="bg-gray-50 text-gray-900">

    <header class="p-4 bg-white shadow-md sticky top-0 z-10">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="/index" title="HaiAcolo Home" class="flex items-center text-xl font-bold text-gray-900">

            <nav class="hidden md:flex space-x-6">

    <div id="mobile-menu-directory" class="hidden fixed inset-0 bg-white z-50 pt-20">

            <i class="fas fa-times text-2xl"></i>
        </button>

            <a href="/founder" class="block text-2xl font-medium text-gray-900 hover:text-primary-600">Pentru Afaceri</a>
            <a href="/directory" class="block text-2xl font-medium text-primary-600 hover:text-primary-700">Parteneri</a>
        </div>
    </div>

    <main class="py-20 px-6">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl font-bold text-center mb-12 gradient-text">Parteneri</h1>
            <div class="bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-4 mb-8 rounded-md">
                <p class="font-bold">Suntem la început de drum!</p>
                <p>Aceștia sunt partenerii noștri. Mai multe afaceri în curând!</p>
            </div>
            <div id="merchant-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                </div>
            <div id="loading-state" class="text-center">
                <p class="text-lg text-gray-600">Se încarcă afacerile...</p>
            </div>
        </div>

            <a href="/privacy" class="hover:text-primary-500">Confidențialitate</a>
        </p>
    </footer>

    <script src="/src/directory.js"></script>

    <script>
        // Mobile Menu Functionality (Unified)
        document.addEventListener("DOMContentLoaded", function () {
            const mobileMenuButton = document.getElementById("mobile-menu-button-directory");
            const closeMobileMenu = document.getElementById("close-mobile-menu-directory");
            const mobileMenu = document.getElementById("mobile-menu-directory");
            const body = document.body;

            // Open mobile menu
            mobileMenuButton.addEventListener("click", function () {
                mobileMenu.classList.remove("hidden");
                body.style.overflow = "hidden";
            });

            // Close mobile menu
            closeMobileMenu.addEventListener("click", function () {
                mobileMenu.classList.add("hidden");
                body.style.overflow = "";
            });

            // Close menu when clicking on links
            const mobileLinks = mobileMenu.querySelectorAll("a");
            mobileLinks.forEach(link => {
                link.addEventListener("click", function (e) {
                    // Don't prevent default for mailto links
                    if (!this.href.startsWith("mailto:")) {
                        e.preventDefault();
                    }

                    mobileMenu.classList.add("hidden");
                    body.style.overflow = "";

                    if (!this.href.startsWith("mailto:")) {
                        setTimeout(() => {
                            window.location.href = this.href;
                        }, 300);
                    }
                });
            });
        });
    </script>

</body>
