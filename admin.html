<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | HaiAcolo</title>
    <link rel="icon" href="/public/logo.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">

    <!-- Login Container -->
    <div id="login-container" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
            <h1 class="text-2xl font-bold mb-6 text-center">Autentificare Admin</h1>
            <form id="login-form">
                <div id="login-feedback" class="mb-4 text-red-500 text-sm"></div>
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700">Parolă</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit" id="login-button"
                    class="w-full px-4 py-2 font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Autentificare
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div id="dashboard-container" style="display: none;" class="p-4">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold">HaiAcolo - Panou de Administrare</h1>
                <button id="logout-button"
                    class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Deconectare</button>
            </div>
            <div class="overflow-x-auto bg-white rounded-lg shadow p-4">
                <table class="min-w-full text-sm text-left">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="p-2">Nume</th>
                            <th class="p-2">Locație</th>
                            <th class="p-2">Tip</th>
                            <th class="p-2">Ofertă</th>
                            <th class="p-2">Status</th>
                            <th class="p-2">Acțiuni</th>
                        </tr>
                    </thead>
                    <tbody id="merchants-table-body">
                        <!-- Merchant rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="/src/admin.js"></script>
</body>

</html>
