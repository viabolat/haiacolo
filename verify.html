<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificare Cod | HaiAcolo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/src/verify.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <main id="verification-card" aria-live="polite" aria-atomic="true"
        class="bg-white p-8 md:p-10 rounded-xl shadow-2xl w-full max-w-md transition-all duration-300">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Verificare Rapidă HaiAcolo</h1>


        <!-- QR Code Scanner View -->
        <div id="qr-reader" class="hidden w-full rounded-lg overflow-hidden border-2 border-gray-300"></div>

        <!-- QR Scanner Error Message -->
        <div id="qr-reader-error" class="hidden text-center p-4 bg-red-100 text-red-800 rounded-lg">
            <p class="font-bold">Nu s-a putut porni camera.</p>
            <p class="text-sm mt-1">Asigurați-vă că ați acordat permisiuni în browser pentru acest site.</p>
        </div>

        <div id="initial-state" class="text-center">
            <div class="space-y-4">
                <button type="button" id="start-scan-button"
                    class="w-full py-4 px-6 bg-indigo-600 text-white font-bold text-lg rounded-lg hover:bg-indigo-700 transition-colors flex items-center justify-center">
                    <svg class="w-6 h-6 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3.75 4.5a.75.75 0 00-1.5 0v1.5h-1.5a.75.75 0 000 1.5h1.5v1.5a.75.75 0 001.5 0v-1.5h1.5a.75.75 0 000-1.5h-1.5v-1.5zm15 0a.75.75 0 00-1.5 0v1.5h-1.5a.75.75 0 000 1.5h1.5v1.5a.75.75 0 001.5 0v-1.5h1.5a.75.75 0 000-1.5h-1.5v-1.5zm-7.5 0a.75.75 0 00-1.5 0v1.5h-1.5a.75.75 0 000 1.5h1.5v1.5a.75.75 0 001.5 0v-1.5h1.5a.75.75 0 000-1.5h-1.5v-1.5zM3 13.5a.75.75 0 000 1.5h1.5a.75.75 0 000-1.5H3zm4.5 0a.75.75 0 000 1.5h1.5a.75.75 0 000-1.5H7.5zm4.5 0a.75.75 0 000 1.5h1.5a.75.75 0 000-1.5H12zm4.5 0a.75.75 0 000 1.5h1.5a.75.75 0 000-1.5H16.5zm-12 4.5a.75.75 0 000 1.5h1.5a.75.75 0 000-1.5H4.5zm4.5 0a.75.75 0 000 1.5h1.5a.75.75 0 000-1.5H9zm4.5 0a.75.75 0 000 1.5h1.5a.75.75 0 000-1.5H13.5zm4.5 0a.75.75 0 000 1.5h1.5a.75.75 0 000-1.5H18zm-13.5-9a.75.75 0 000 1.5h1.5a.75.75 0 000-1.5H4.5z" />
                    </svg>
                    Scanează Codul QR
                </button>
                <button type="button" id="show-manual-entry-button"
                    class="w-full py-3 px-6 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 transition-colors">
                    Introdu Codul Manual
                </button>
            </div>
        </div>

        <!-- Manual Code Entry Fallback -->
        <div id="manual-entry-section" class="hidden mt-4">
            <p class="text-center text-gray-600 mb-2">Introduceți codul:</p>
            <div class="flex space-x-2">
                <input type="text" id="manual-code-input"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="ABC-123" aria-label="Cod manual">
                <button type="button" id="manual-verify-button"
                    class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition-colors">Verifică</button>
            </div>
        </div>

        <div id="loading-indicator" class="hidden text-center p-4">
            <svg class="animate-spin h-8 w-8 text-indigo-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            <p class="mt-2 text-indigo-600 font-medium">Se verifică codul...</p>
        </div>

        <div id="result-display" class="text-center transition-all duration-300 hidden">
            <h2 id="result-title" class="text-2xl font-bold mb-3"></h2>
            <div id="result-offer-wrapper" class="hidden bg-indigo-50 border-l-4 border-indigo-400 p-4 my-4">
                <p class="font-bold text-indigo-800">Ofertă de aplicat:</p>
                <p id="result-offer" class="text-lg text-indigo-900"></p>
            </div>
            <p id="result-message" class="text-md text-gray-600 mt-4"></p>
        </div>

        <!-- New Reset Button Section -->
        <div id="reset-section" class="hidden mt-6">
            <button type="button" id="reset-button"
                class="w-full py-3 bg-gray-500 text-white font-semibold rounded-lg hover:bg-gray-600 transition-colors">
                Verifică Următorul Cod
            </button>
            <!-- New Cancel Scan Button -->
            <button type="button" id="cancel-scan-button"
                class="hidden w-full py-3 mt-2 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700 transition-colors">
                Anulează
            </button>
        </div>

    </main>

    <script src="/src/verify.js"></script>
</body>

</html>
