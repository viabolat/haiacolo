name: Deal Matcher

on:
  workflow_dispatch:
  #schedule:
    # Runs at 09:00 UTC every Monday
    #- cron: "0 9 * * 1"

jobs:
  build-and-send-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" # Or your preferred Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deal Matcher Script
        env:
          # These secrets must be configured in your GitHub repository settings
          # Go to Settings > Secrets and variables > Actions > New repository secret
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python deal_matcher.py

      - name: Upload Artifacts as a Backup
        if: always() # This ensures artifacts are uploaded even if the script fails
        uses: actions/upload-artifact@v4
        with:
          name: deal-artifacts-${{ github.run_id }}
          path: |
            deals_to_send.csv
            qrcodes/
