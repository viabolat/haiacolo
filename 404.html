<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagină Negăsită | HaiAcolo</title>

    <meta name="description"
        content="Pagina pe care o căutați nu a fost găsită. Se pare că link-ul este greșit sau pagina a fost ștearsă.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://www.haiacolo.ro/404" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 400: '#a78bfa',
                            500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95',
                        },
                        secondary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8',
                            500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <link rel="icon" href="/public/logo.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/public/logo.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/logo.png">
    <link rel="icon" href="/public/logo.svg" type="image/svg+xml" sizes="any">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e7f1 100%);
            min-height: 100vh;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Removed complex logo styles for unification */

        .gradient-text {
            background: linear-gradient(135deg, #8b5cf6 0%, #0ea5e9 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        
        /* Removed complex mobile menu styles */
    </style>
</head>

<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen">

    <header class="p-4 bg-white shadow-md sticky top-0 z-10">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="/index" title="HaiAcolo Home" class="flex items-center text-xl font-bold text-gray-900">
                <img src="/public/logo.svg" alt="HaiAcolo Logo" class="w-10 h-10 mr-2">
                HaiAcolo
            </a>
            <nav class="hidden md:flex space-x-6">
                <a href="/user" class="text-gray-600 hover:text-secondary-600 font-medium transition duration-200">Vreau Oferte</a>
                <a href="/founder" class="text-gray-600 hover:text-primary-600 font-medium transition duration-200">Pentru Afaceri</a>
                <a href="/directory" class="text-gray-600 hover:text-primary-600 font-medium transition duration-200">Parteneri</a>
            </nav>
            <button id="mobile-menu-button-404" class="md:hidden text-gray-600">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </div>
    </header>

    <div id="mobile-menu-404" class="hidden fixed inset-0 bg-white z-50 pt-20">
        <button id="close-mobile-menu-404" class="absolute top-4 right-4 text-gray-600">
            <i class="fas fa-times text-2xl"></i>
        </button>
        <div class="space-y-8 text-center p-6">
            <a href="/user" class="block text-2xl font-medium text-gray-900 hover:text-secondary-600">Vreau Oferte</a>
            <a href="/founder" class="block text-2xl font-medium text-gray-900 hover:text-primary-600">Pentru Afaceri</a>
            <a href="/directory" class="block text-2xl font-medium text-gray-900 hover:text-primary-600">Parteneri</a>
        </div>
    </div>

    <main class="flex-grow flex items-center justify-center text-center px-6">
        <div>
            <h1 class="text-8xl font-bold gradient-text mb-4">404</h1>
            <h2 class="text-3xl font-semibold mb-4">Oops! Pagina nu a fost găsită.</h2>
            <p class="text-lg text-gray-600 mb-8">
                Se pare că link-ul este greșit sau pagina a fost ștearsă. 
                <br>Te rugăm să revii la <a href="/" class="text-primary-600 hover:text-primary-700 underline font-semibold">pagina principală</a>.
            </p>
        </div>
    </main>

    <footer class="p-8 bg-gray-800 text-center text-gray-300 mt-0">
        <p class="text-sm">&copy; 2025 HaiAcolo. Toate drepturile rezervate. | 
            <a href="/privacy" class="hover:text-primary-500">Confidențialitate</a>
    </footer>


    <script>
        // Mobile Menu Functionality (Unified)
        document.addEventListener("DOMContentLoaded", function () {
            const mobileMenuButton = document.getElementById("mobile-menu-button-404");
            const closeMobileMenu = document.getElementById("close-mobile-menu-404");
            const mobileMenu = document.getElementById("mobile-menu-404");
            const body = document.body;

            // Open mobile menu
            mobileMenuButton.addEventListener("click", function () {
                mobileMenu.classList.remove("hidden");
                body.style.overflow = "hidden";
            });

            // Close mobile menu
            closeMobileMenu.addEventListener("click", function () {
                mobileMenu.classList.add("hidden");
                body.style.overflow = "";
            });

            // Close menu when clicking on links
            const mobileLinks = mobileMenu.querySelectorAll("a");
            mobileLinks.forEach(link => {
                link.addEventListener("click", function (e) {
                    // Don't prevent default for mailto links
                    if (!this.href.startsWith("mailto:")) {
                        e.preventDefault();
                    }

                    mobileMenu.classList.add("hidden");
                    body.style.overflow = "";

                    if (!this.href.startsWith("mailto:")) {
                        setTimeout(() => {
                            window.location.href = this.href;
                        }, 300);
                    }
                });
            });
        });
    </script>
</body>

</html>
